name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - run: go vet ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/pmtray.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: pmtray-windows-amd64
          path: dist/pmtray.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o dist/pmtray-linux-amd64 .
      - uses: actions/upload-artifact@v7
        with:
          name: pmtray-linux-amd64
          path: dist/pmtray-linux-amd64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pmtray.exe
            dist/pmtray-linux-amd64
          generate_release_notes: true
